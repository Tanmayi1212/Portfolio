<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="description" content="CS Student passionate about Web Development & AI/ML. Explore my projects and experience." />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">

    <meta property="og:title" content="Tanmayi Nadipalli | CS Student & Developer" />
    <meta property="og:description" content="CS Student passionate about Web Development & AI/ML" />
    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary_large_image" />

    <style>
      /* ── Navigation bar ── */
      .site-nav {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 60;
        display: flex;
        align-items: center;
        gap: 1rem;
        padding: 0.75rem 1.5rem;
        background: rgba(245, 236, 218, 0.85);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        color: #442D1C;
        transition: background-color .3s ease, box-shadow .3s ease;
        box-shadow: 0 1px 0 rgba(68,45,28,0.12);
        pointer-events: auto;
      }
      .site-nav.scrolled {
        background: rgba(245, 236, 218, 0.95);
        box-shadow: 0 4px 24px rgba(68,45,28,0.12);
      }
      .site-nav a, .site-nav button {
        color: inherit;
        font-family: 'Outfit', sans-serif;
      }
    </style>
  </head>

  <body style="background-color:#F5ECDA; color:#442D1C;">
    <div id="root"></div>

    <script>
      // Scrolled class on navbar
      (function(){
        const findNav = () => document.querySelector('.site-nav');
        const apply = (nav) => {
          window.addEventListener('scroll', () => {
            if (window.scrollY > 40) nav.classList.add('scrolled');
            else nav.classList.remove('scrolled');
          }, { passive: true });
        };
        const wait = setInterval(() => {
          const nav = findNav();
          if (nav) { clearInterval(wait); apply(nav); }
        }, 100);
      })();
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
